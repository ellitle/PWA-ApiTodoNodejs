# Fait avec l'AI 

name: Deploy Backend to VPS

on:
  push:
    branches: [etu]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "swagger.yml"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-vps
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies, build and test
        run: |
          npm ci
          npm test

      - name: Prepare API environment from secrets
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: node deploy/write-env.cjs

      - name: Prepare release directory
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: RELEASE_ID
          script: |
            set -eu
            command -v node
            command -v npm
            command -v curl
            test "$(node -p 'process.versions.node.split(".")[0]')" = 24
            sudo -n test -f /etc/systemd/system/bank.service
            sudo -n install -d -m 755 -o "$(id -un)" -g "$(id -gn)" "/var/www/bank/releases/$RELEASE_ID"

      - name: Upload compiled API
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "dist,package.json,package-lock.json,swagger.yml,bank.env"
          target: /var/www/bank/releases/${{ env.RELEASE_ID }}

      - name: Install production dependencies and restart Bank API
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: RELEASE_ID
          command_timeout: 10m
          script: |
            set -eu
            release="/var/www/bank/releases/$RELEASE_ID"
            trap 'sudo -n rm -f "$release/bank.env"' EXIT
            cd "$release"
            sudo -n chown root:root "$release/bank.env"
            sudo -n chmod 600 "$release/bank.env"
            npm ci --omit=dev
            sudo -n chown -R www-data:www-data "$release/dist" "$release/node_modules" "$release/package.json" "$release/package-lock.json" "$release/swagger.yml"

            previous=$(readlink -f /var/www/bank/current || true)
            env_backup=$(sudo -n mktemp /etc/bank.env.backup.XXXXXX)
            had_env=false
            if sudo -n test -f /etc/bank.env; then
              sudo -n cp /etc/bank.env "$env_backup"
              had_env=true
            fi
            rollback() {
              if [ "$had_env" = true ]; then
                sudo -n mv -f "$env_backup" /etc/bank.env
              else
                sudo -n rm -f /etc/bank.env "$env_backup"
              fi
              sudo -n rm -f "$release/bank.env" /etc/bank.env.next
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                sudo -n ln -sfn "$previous" /var/www/bank/current.next
                sudo -n mv -Tf /var/www/bank/current.next /var/www/bank/current
                sudo -n systemctl restart bank || true
              else
                sudo -n systemctl stop bank || true
              fi
            }
            trap rollback EXIT
            sudo -n install -m 600 -o root -g root "$release/bank.env" /etc/bank.env.next
            sudo -n mv -f /etc/bank.env.next /etc/bank.env
            sudo -n rm -f "$release/bank.env"
            sudo -n ln -sfn "$release" /var/www/bank/current.next
            sudo -n mv -Tf /var/www/bank/current.next /var/www/bank/current
            sudo -n systemctl restart bank

            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:3001/ping; then
                sudo -n systemctl is-active --quiet bank
                sudo -n rm -f "$env_backup"
                trap - EXIT
                exit 0
              fi
              sleep 2
            done
            sudo -n systemctl status bank --no-pager || true
            exit 1

      - name: Remove runner environment file
        if: always()
        run: rm -f bank.env
